<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BOLOTO_OS_MAIN_TERMINAL - REGISTRATION</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-surface": "#cee9d4",
                        "secondary-fixed": "#56ffa8",
                        "primary": "#ffe8ae",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#745b00",
                        "secondary": "#ddffe4",
                        "outline": "#9a9078",
                        "tertiary-container": "#39e0ff",
                        "on-secondary-fixed-variant": "#00522f",
                        "on-secondary-container": "#006e41",
                        "surface-variant": "#233a2b",
                        "error-container": "#93000a",
                        "primary-fixed": "#ffe089",
                        "on-surface-variant": "#d1c5ab",
                        "surface-container-highest": "#233a2b",
                        "surface-container-lowest": "#001207",
                        "on-surface": "#cee9d4",
                        "inverse-on-surface": "#1f3527",
                        "tertiary": "#c1f2ff",
                        "on-primary-fixed-variant": "#574400",
                        "on-background": "#cee9d4",
                        "error": "#ffb4ab",
                        "outline-variant": "#4e4632",
                        "surface-tint": "#f0c100",
                        "on-tertiary-fixed": "#001f25",
                        "surface": "#02170b",
                        "on-tertiary-container": "#00606f",
                        "secondary-container": "#00f999",
                        "on-tertiary-fixed-variant": "#004e5b",
                        "on-tertiary": "#00363f",
                        "on-primary": "#3d2f00",
                        "background": "#02170b",
                        "primary-container": "#f9c806",
                        "on-secondary-fixed": "#002110",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#2bd9f7",
                        "tertiary-fixed": "#a7edff",
                        "surface-bright": "#273e2f",
                        "on-primary-container": "#6b5500",
                        "secondary-fixed-dim": "#00e38b",
                        "surface-container": "#0d2417",
                        "primary-fixed-dim": "#f0c100",
                        "surface-container-high": "#182f21",
                        "surface-container-low": "#092013",
                        "surface-dim": "#02170b",
                        "on-primary-fixed": "#241a00",
                        "on-secondary": "#00391f"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "baseline": "4px",
                        "sidebar-width": "30%",
                        "gutter": "1.5rem",
                        "main-padding": "3rem",
                        "section-gap": "4rem"
                    },
                    fontFamily: {
                        "body-md": ["Space Mono"],
                        "display-xl-mobile": ["Space Mono"],
                        "code-snippet": ["Space Mono"],
                        "label-sm": ["Space Mono"],
                        "display-xl": ["Space Mono"],
                        "headline-lg": ["Space Mono"]
                    },
                    fontSize: {
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "display-xl-mobile": ["48px", { lineHeight: "1.1", fontWeight: "700" }],
                        "code-snippet": ["14px", { lineHeight: "1.4", fontWeight: "400" }],
                        "label-sm": ["12px", { lineHeight: "1.0", letterSpacing: "0.15em", fontWeight: "700" }],
                        "display-xl": ["72px", { lineHeight: "1.0", letterSpacing: "-0.05em", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "0.05em", fontWeight: "700" }]
                    },
                    animation: {
                        'crt-flicker': 'flicker 0.15s infinite',
                        'blink-cursor': 'blink 1s step-end infinite',
                    },
                    keyframes: {
                        flicker: {
                            '0%': { opacity: '0.95' },
                            '100%': { opacity: '1' },
                        },
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
<style>
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 50;
        }
        .glow-input:focus {
            box-shadow: 0 0 10px rgba(0, 250, 154, 0.2);
            border-color: #00f999;
        }
        .btn-hazard:hover {
            box-shadow: 0 0 15px rgba(249, 200, 6, 0.4);
            color: #ffe8ae;
            background-color: transparent;
            border-color: #f9c806;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md h-screen w-screen overflow-hidden flex items-center justify-center relative animate-crt-flicker">
<!-- CRT Overlay -->
<div class="fixed inset-0 crt-overlay"></div>
<!-- Registration Window -->
<main class="w-full max-w-md bg-surface-container border border-outline p-main-padding rounded flex flex-col relative z-10 mx-gutter shadow-[0_0_30px_rgba(249,200,6,0.05)]">
<!-- Header -->
<header class="flex flex-col items-center mb-8 border-b border-outline pb-4">
<span class="material-symbols-outlined text-primary-container text-4xl mb-2" style="font-variation-settings: 'FILL' 1;">terminal</span>
<h1 class="font-headline-lg text-headline-lg text-primary-container uppercase text-center tracking-widest">
                NEW_OPERATOR_REGISTRATION
            </h1>
<p class="font-label-sm text-label-sm text-outline mt-2 uppercase flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary-container animate-pulse inline-block shadow-[0_0_5px_#00f999]"></span>
                SECURE_UPLINK_ESTABLISHED
            </p>
</header>
<!-- Form -->
<form class="flex flex-col gap-6 w-full">
<!-- Callsign Field -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-secondary-container uppercase" for="callsign">
                    CHOOSE_CALLSIGN <span class="animate-blink-cursor">_</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-sm">badge</span>
<input class="w-full bg-surface-container-lowest border border-outline text-on-surface font-code-snippet text-code-snippet pl-10 pr-4 py-3 rounded-none focus:outline-none focus:border-secondary-container glow-input transition-colors placeholder-outline-variant uppercase" id="callsign" name="callsign" placeholder="ENTER_IDENTIFIER" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-secondary-container uppercase" for="email">
                    EMAIL_UPLINK <span class="animate-blink-cursor">_</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-sm">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline text-on-surface font-code-snippet text-code-snippet pl-10 pr-4 py-3 rounded-none focus:outline-none focus:border-secondary-container glow-input transition-colors placeholder-outline-variant uppercase" id="email" name="email" placeholder="COMMS_ADDRESS" required="" type="email"/>
</div>
</div>
<!-- Secure Key Field -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-secondary-container uppercase" for="password">
                    SECURE_KEY <span class="animate-blink-cursor">_</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-sm">key</span>
<input class="w-full bg-surface-container-lowest border border-outline text-on-surface font-code-snippet text-code-snippet pl-10 pr-4 py-3 rounded-none focus:outline-none focus:border-secondary-container glow-input transition-colors placeholder-outline-variant" id="password" name="password" placeholder="**********" required="" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-2 group cursor-pointer">
<div class="relative flex items-center justify-center mt-1">
<input class="peer appearance-none w-5 h-5 border border-outline bg-surface-container-lowest checked:bg-secondary-container checked:border-secondary-container rounded-none cursor-pointer transition-colors focus:ring-0 focus:outline-none focus:border-secondary-container" id="terms" name="terms" required="" type="checkbox"/>
<span class="material-symbols-outlined absolute text-surface-container-lowest text-sm opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-label-sm text-label-sm text-outline-variant group-hover:text-secondary-container cursor-pointer transition-colors uppercase leading-tight" for="terms">
                    I ACCEPT ALL SWAMP_LAB PROTOCOLS
                </label>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary-container text-on-primary font-label-sm text-label-sm py-4 border border-transparent rounded uppercase tracking-widest transition-all duration-300 btn-hazard flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">power</span>
                CREATE_IDENTITY.SH
            </button>
<!-- Back Link -->
<div class="text-center mt-4">
<a class="font-label-sm text-label-sm text-outline hover:text-secondary-container transition-colors uppercase" href="#">
                    [ RETURN_TO_LOGIN ]
                </a>
</div>
</form>
</main>
<script>
        // Simple script to add random scanline glitches
        setInterval(() => {
            const body = document.body;
            if(Math.random() > 0.95) {
                body.style.transform = `translateX(${Math.random() * 2 - 1}px)`;
                setTimeout(() => {
                    body.style.transform = 'none';
                }, 50);
            }
        }, 100);
    </script>
</body></html>
