{% extends "frogsnet/layout.html" %}

{% block title %}frogs.net - New Thread{% endblock %}

{% block frogs_content %}
<header class="frogs-header">
    <div>
        <div class="terminal-eyebrow">UPLINK_ESTABLISHED</div>
        <h1 class="frogs-title">Compose_Transmission</h1>
    </div>
    <span class="frogs-chip">ID: M88-9042-B</span>
</header>

{% if submitted %}
    <div class="transmission-status transmission-status--ok">&gt; TRANSMISSION QUEUED FOR MODERATION.</div>
{% endif %}

<form class="terminal-form" method="post">
    {% csrf_token %}
    <div class="form-row form-row--stacked">
        <label class="form-label" for="title">TITLE &gt;</label>
        <input id="title" name="title" placeholder="ENTER_TRANSMISSION_SUBJECT..." type="text">
    </div>
    <div class="form-row form-row--stacked">
        <label class="form-label" for="topic">TOPIC_DIR &gt;</label>
        <select id="topic" name="topic">
            {% for option in topic_options %}
                <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row form-row--stacked">
        <label class="form-label" for="body">BODY_DATA &gt;</label>
        <textarea id="body" name="body" placeholder="// ENTER_DATA_LOG_HERE..."></textarea>
    </div>
    <button class="terminal-button terminal-button--primary contact-shell__submit" type="submit">TRANSMIT_DATA.SH</button>
</form>
{% endblock %}
